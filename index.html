<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крестики-нолики • Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="card">
    <header class="hero">
      <div class="eyebrow">АРКАДА • BROWSER ARENA</div>
      <h1>Крестики-нолики</h1>
      <p class="subtitle">Соберите победную серию раньше соперника</p>
    </header>

    <div class="mode-switch" role="group" aria-label="Режим игры">
      <button class="mode active" data-mode="ai" type="button">🤖 Против ИИ</button>
      <button class="mode" data-mode="local" type="button">👥 Два игрока</button>
    </div>

    <div class="settings-grid">
      <div class="setting" id="difficultyWrap">
        <label for="difficulty">Сложность</label>
        <select id="difficulty">
          <option value="easy">Лёгкая</option>
          <option value="medium" selected>Средняя</option>
          <option value="hard">Сложная</option>
        </select>
      </div>
      <div class="setting">
        <label for="matchLength">Матч</label>
        <select id="matchLength">
          <option value="1">1 победа</option>
          <option value="3" selected>До 3 побед</option>
          <option value="5">До 5 побед</option>
        </select>
      </div>
      <div class="setting">
        <label for="starter">Первый ход</label>
        <select id="starter">
          <option value="X" selected>Крестики</option>
          <option value="random">Случайно</option>
        </select>
      </div>
      <button class="icon-button" id="soundToggle" type="button" aria-label="Переключить звук">🔊</button>
    </div>

    <div class="scoreboard">
      <div class="score-card player-x"><span id="scoreXLabel">Вы</span><b id="scoreX">0</b></div>
      <div class="turn" id="turn">Ваш ход</div>
      <div class="score-card player-o"><span id="scoreOLabel">ИИ</span><b id="scoreO">0</b></div>
    </div>

    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="match-info"><span id="matchInfo">Матч до 3 побед</span><span id="roundInfo">Раунд 1</span></div>

    <div class="stats">
      <div><span>Игр</span><b id="gamesPlayed">0</b></div>
      <div><span>Побед</span><b id="gamesWon">0</b></div>
      <div><span>Серия</span><b id="winStreak">0</b></div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="Игровое поле"></div>
    </div>
    <div class="status" id="status" aria-live="polite">Ваш ход — выберите клетку</div>

    <div class="actions">
      <button id="restart" type="button">↻ Новая партия</button>
      <button class="secondary" id="undo" type="button">↶ Отменить</button>
      <button class="secondary" id="resetScore" type="button">Сбросить</button>
    </div>
    <div class="hint">Esc — новая партия • Z — отменить ход • Счёт сохраняется в браузере</div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
