<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крестики-нолики</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="card">
    <div class="eyebrow">АРКАДА • БРАУЗЕРНАЯ ИГРА</div>
    <h1>Крестики-нолики</h1>
    <p class="subtitle">Классическая дуэль на поле 3 × 3</p>
    <div class="scoreboard">
      <div><span>Крестики</span><b id="scoreX">0</b></div>
      <div class="turn" id="turn">Ход крестиков</div>
      <div><span>Нолики</span><b id="scoreO">0</b></div>
    </div>
    <div class="board" id="board" aria-label="Игровое поле"></div>
    <div class="status" id="status">Ваш ход — выберите клетку</div>
    <div class="actions">
      <button id="restart">Новая игра</button>
      <button class="secondary" id="resetScore">Сбросить счёт</button>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
